<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRForge</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">
        <h1>QRForge</h1>
        <p>Создавай QR-коды за несколько секунд</p>

        <input
            id="text"
            type="text"
            placeholder="Введите текст или ссылку"
        >

        <button id="generateButton">
            Создать QR-код
        </button>

      <div id="qr"></div>

<div class="actions">
    <button id="downloadButton" hidden>
        Скачать QR-код
    </button>

    <button id="clearButton" class="secondary">
        Очистить
    </button>
</div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="script.js"></script>
</body>
</html>
